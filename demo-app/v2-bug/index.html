<!doctype html>
<!-- v2-bug: the v2 redesign plus two GENUINE bugs that healing must not hide.
     Bug 1: the submit script still looks up the old v1 id "confirmation", so it crashes and
            the claim is never submitted. The button is there, it just does not work.
     Bug 2: the mobile number field was deleted by mistake, so choosing "Phone" shows nothing. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Acme Mutual - Start your claim</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; color: #102a43; }
      [hidden] { display: none !important; }
      .form-row { margin-bottom: 1.2rem; display: grid; gap: 0.3rem; }
      input, select, textarea { padding: 0.6rem; font: inherit; border: 1px solid #9fb3c8; border-radius: 6px; }
      .actions { display: flex; gap: 0.75rem; justify-content: flex-end; }
      .button { padding: 0.7rem 1.4rem; font: inherit; border: 0; border-radius: 999px; cursor: pointer; }
      .button--primary { background: #127fbf; color: white; }
      .button--ghost { background: transparent; border: 1px solid #127fbf; color: #127fbf; }
      .notice--error { color: #b00020; }
      .notice--success { background: #e3f9e5; padding: 1rem; border-radius: 6px; }
    </style>
  </head>
  <body>
    <h1>Start your claim</h1>
    <form id="claim-form" novalidate>
      <div class="form-row">
        <!-- id, name and label changed. data-testid kept. -->
        <label for="policy-ref">Policy reference</label>
        <input id="policy-ref" name="policyRef" data-testid="policy-number" placeholder="e.g. AM-123456" />
      </div>
      <div class="form-row">
        <!-- id and test id changed. Label kept. -->
        <label for="claim-category">Type of claim</label>
        <select id="claim-category" name="claimType">
          <option value="">Select</option>
          <option value="escape-of-water">Escape of water</option>
          <option value="storm">Storm damage</option>
          <option value="theft">Theft</option>
        </select>
      </div>
      <div class="form-row">
        <!-- id restyled from camelCase to kebab-case, test id removed. Label, name and type kept. -->
        <label for="incident-date">Date of incident</label>
        <input id="incident-date" name="incidentDate" type="date" />
      </div>
      <div class="form-row">
        <!-- id, label and test id changed. name kept. -->
        <label for="claim-details">Tell us what happened</label>
        <textarea id="claim-details" name="description" rows="5"></textarea>
      </div>
      <fieldset class="form-row">
        <legend>Contact preference</legend>
        <label><input type="radio" name="contact" value="email" checked /> Email</label>
        <!-- id changed. Label text kept. -->
        <label><input type="radio" id="contact-by-phone" name="contact" value="phone" /> Phone</label>
      </fieldset>
      <!-- BUG 2: the phone number row has been deleted. -->
      <p id="form-errors" class="notice--error" role="alert"></p>
      <div class="actions">
        <!-- Buttons swapped round. Submit button: new id, class and text, test id removed. -->
        <button type="submit" id="send-claim" class="button button--primary">Send claim</button>
        <button type="button" id="save-for-later" class="button button--ghost">Save for later</button>
      </div>
    </form>
    <div id="claim-confirmation" class="notice--success" role="status" hidden></div>

    <script>
      const form = document.getElementById('claim-form');
      const error = document.getElementById('form-errors');

      form.addEventListener('change', () => {
        // BUG 2: nothing to show any more.
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        if (!form.policyRef.value.trim()) {
          error.textContent = 'Please enter your policy number.';
          return;
        }
        if (!form.claimType.value) {
          error.textContent = 'Please choose the type of claim.';
          return;
        }
        error.textContent = '';
        // BUG 1: old v1 id. getElementById returns null and the next line throws.
        const confirmation = document.getElementById('confirmation');
        confirmation.textContent = 'Thanks, we have your claim. Your reference is CLM-' + form.policyRef.value.slice(-4) + '.';
        confirmation.hidden = false;
        form.hidden = true;
      });
    </script>
  </body>
</html>
